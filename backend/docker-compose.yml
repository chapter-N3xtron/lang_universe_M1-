services:
  langgraph-api:
    image: jasper-langgraph:current
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      LANGGRAPH_API_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langgraph
      REDIS_URL: redis://redis:6379

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph
    volumes:
      - backend_langgraph-data:/var/lib/postgresql/data

  redis:
    image: redis:6
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  backend_langgraph-data:
