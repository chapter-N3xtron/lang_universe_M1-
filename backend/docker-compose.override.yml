services:
  langgraph-api:
    volumes:
      - ../todos.json:/app-data/todos.json:ro
      - ../data/ocr/uploads:/app-data/ocr/uploads
      - ../data/coding-checkpoints:/deps/backend/data
    environment:
      - AGENT_WORKSPACE=/app-data
      - TODOS_FILE=/app-data/todos.json
      - OCR_UPLOAD_DIR=/app-data/ocr/uploads
      - CODING_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_HOST=http://host.docker.internal:11434
      - SESSION_RUNTIME_MODE=durable
      - SESSION_RUNTIME_ID=backend-postgres-v1
      - CUSTODIAN_WORKER_URL=http://host.docker.internal:8765
