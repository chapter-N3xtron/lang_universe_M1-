[project]
name = "docker-broker"
version = "0.1.0"
description = "Session-scoped host broker for policy-constrained Docker Compose operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pyyaml>=6,<7",
    "ruamel-yaml>=0.18,<0.19",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
docker-broker = "docker_broker:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]
