[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "macos-host-executor"
version = "0.1.0"
description = "Non-agent, policy-limited macOS host operation executor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
macos-host-executor = "macos_host_executor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_host_executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
