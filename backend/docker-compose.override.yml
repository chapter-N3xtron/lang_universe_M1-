services:
  langgraph-api:
    volumes:
      - ..:/workspace
      - /Volumes/Storage:/Volumes/Storage
      - ${HOME}:${HOME}
      - coding-tools:/opt/coding-tools
    tmpfs:
      - ${HOME}/.ssh
      - ${HOME}/.aws
      - ${HOME}/.gnupg
      - ${HOME}/.config/gh
    environment:
      - AGENT_WORKSPACE=/workspace
      - TODOS_FILE=/workspace/todos.json
      - CODING_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SESSION_RUNTIME_MODE=durable
      - SESSION_RUNTIME_ID=backend-postgres-v1
      - NPM_CONFIG_PREFIX=/opt/coding-tools/node
      - PNPM_HOME=/opt/coding-tools/pnpm

volumes:
  coding-tools:
