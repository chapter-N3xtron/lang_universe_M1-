[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "film-workflow-experiment"
version = "0.1.0"
description = "Typed scaffolding for an LLM-driven Blender and ComfyUI film workflow investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
integration = [
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/film_workflow"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
