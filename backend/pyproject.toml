[project]
name = "langgraph-agent-chat-deep-agents"
version = "1.0.0"
description = "Multi-agent system with LangGraph, Chat UI, and Deep Agents"
requires-python = ">=3.11,<4"
dependencies = [
    "langchain>=1.3.14,<2",
    "langgraph>=1.2.0,<2",
    "langgraph-checkpoint-sqlite>=3.0.3,<4",
    "langgraph-checkpoint-postgres>=3.0.2,<4",
    "langgraph-prebuilt>=1.0.1,<2",
    "langgraph-sdk>=0.3.5",
    "langgraph-cli[inmem]>=0.4.31,<1",
    "langchain-core>=0.3.66",
    "langsmith>=0.7.31",
    "tavily-python>=0.3.0,<1",
    "langchain-tavily>=0.2.18,<1",
    "firecrawl-py>=1.0.0",
    "langchain-ollama>=0.2.0,<1",
    "langchain-huggingface>=1.2.2,<2",
    "deepagents==0.7.0b2",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
sidecar = [
    "kokoro>=0.7.16",
    "soundfile>=0.12.0",
    "numpy>=1.26.0,<3",
    "faster-whisper>=1.0.0",
    "python-multipart>=0.0.20",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1,<2",
    "odfpy>=1.4,<2",
    "striprtf>=0.0.29,<1",
    "beautifulsoup4>=4.14,<5",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]
